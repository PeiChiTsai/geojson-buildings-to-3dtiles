<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590">
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" x2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" x2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="590" rx="24" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="102" rx="24" fill="url(#header)"/>

  <text x="550" y="47" text-anchor="middle" fill="#ffffff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">
    Building GeoJSON → 3D Tiles for Cesium
  </text>
  <text x="550" y="76" text-anchor="middle" fill="#cbd5e1"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    One geometry pipeline · two elevation workflows
  </text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="250" height="88" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <text x="180" y="183" text-anchor="middle" fill="#0f172a"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">
    Building footprints
  </text>
  <text x="180" y="209" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    GeoJSON · EPSG:3857
  </text>

  <line x1="305" y1="194" x2="400" y2="194" stroke="#64748b" stroke-width="3"/>
  <polygon points="400,194 388,187 388,201" fill="#64748b"/>

  <!-- Flat -->
  <g filter="url(#shadow)">
    <rect x="400" y="128" width="310" height="136" rx="18" fill="url(#flat)" stroke="#93c5fd"/>
  </g>
  <text x="555" y="163" text-anchor="middle" fill="#1e3a8a"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
    FLAT
  </text>
  <text x="555" y="190" text-anchor="middle" fill="#334155"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    buildings_to_3dtiles.py
  </text>
  <text x="555" y="216" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    base elevation = 0 m
  </text>
  <text x="555" y="239" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    no terrain data required
  </text>

  <!-- Terrain branch -->
  <line x1="305" y1="194" x2="355" y2="194" stroke="#64748b" stroke-width="3"/>
  <line x1="355" y1="194" x2="355" y2="390" stroke="#64748b" stroke-width="3"/>
  <line x1="355" y1="390" x2="400" y2="390" stroke="#64748b" stroke-width="3"/>
  <polygon points="400,390 388,383 388,397" fill="#64748b"/>

  <g filter="url(#shadow)">
    <rect x="400" y="322" width="310" height="136" rx="18" fill="url(#terrain)" stroke="#86efac"/>
  </g>
  <text x="555" y="357" text-anchor="middle" fill="#166534"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
    TERRAIN-ALIGNED
  </text>
  <text x="555" y="384" text-anchor="middle" fill="#334155"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    create_centroids.py
  </text>
  <text x="555" y="407" text-anchor="middle" fill="#334155"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    ↓ Cesium World Terrain
  </text>
  <text x="555" y="431" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    ↓ --terrain terrain_elevations.json
  </text>

  <line x1="710" y1="196" x2="800" y2="196" stroke="#64748b" stroke-width="3"/>
  <polygon points="800,196 788,189 788,203" fill="#64748b"/>
  <line x1="710" y1="390" x2="758" y2="390" stroke="#64748b" stroke-width="3"/>
  <line x1="758" y1="390" x2="758" y2="260" stroke="#64748b" stroke-width="3"/>
  <line x1="758" y1="260" x2="800" y2="260" stroke="#64748b" stroke-width="3"/>
  <polygon points="800,260 788,253 788,267" fill="#64748b"/>

  <!-- Shared output -->
  <g filter="url(#shadow)">
    <rect x="800" y="152" width="245" height="182" rx="18" fill="#f8fafc" stroke="#94a3b8"/>
  </g>
  <text x="922" y="187" text-anchor="middle" fill="#0f172a"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
    3D Tiles output
  </text>
  <text x="922" y="218" text-anchor="middle" fill="#334155"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    tileset.json
  </text>
  <text x="922" y="243" text-anchor="middle" fill="#334155"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    tiles/*.b3dm
  </text>
  <text x="922" y="276" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    Cesium · Tellux ·
  </text>
  <text x="922" y="297" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    compatible 3D Tiles viewers
  </text>

  <!-- Bottom notes -->
  <text x="550" y="515" text-anchor="middle" fill="#475569"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    Shared geometry pipeline: triangulation · ENU/ECEF frame · glTF · B3DM · spatial tiling
  </text>
  <text x="550" y="545" text-anchor="middle" fill="#94a3b8"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    The terrain workflow adds elevation sampling; geometry generation remains shared.
  </text>
</svg>
